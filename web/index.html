<!-- Firebase SDK -->

  <!-- PDF.js -->
  <script type="module">
    import { getDocument, GlobalWorkerOptions } from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.mjs';
    GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
  </script>

  <!-- Firebase Config -->
  <script src="firebase-config.js"></script>

  <!-- Service Worker -->
  <script>
    if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === 'cemindo-apps.com') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then((registration) => {
            console.log('✅ Service Worker registered with scope:', registration.scope);
            import('./firebase-config.js').then(({ messaging }) => {
              console.log('✅ Firebase Messaging initialized:', messaging);
            }).catch((error) => {
              console.error('❌ Error loading Firebase Config:', error);
            });
          })
          .catch((error) => {
            console.error('❌ Service Worker registration failed:', error);
          });
      } else {
        console.warn('⚠️ Service Workers are not supported in this browser.');
      }
    } else {
      console.warn('⚠️ Service Worker is disabled because context is not secure.');
    }
  </script>
